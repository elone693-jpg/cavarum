<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Cavarum</title>
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e1c11"/>
      <stop offset="1" stop-color="#110905"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.6" r="0.44">
      <stop offset="0" stop-color="#d4a04a" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#d4a04a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1">
